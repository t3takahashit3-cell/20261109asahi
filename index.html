<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FINAL BOUNDARY 〜感情労働を生き抜く10の防衛線〜</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
  
  :root {
    --primary: #00e5ff;
    --bg-dark: #0a0f16;
    --panel-bg: rgba(16, 28, 48, 0.85);
    --text-main: #e2e8f0;
    --hp-color: #00ffcc;
  }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    background-image: radial-gradient(circle at center, #1a2a40 0%, #0a0f16 100%);
    overflow-x: hidden;
  }

  #app-container {
    width: 100%;
    max-width: 500px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .screen {
    display: none;
    padding: 15px;
    height: 100%;
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .screen.active {
    display: flex;
  }

  /* Title Screen */
  .title-image-container {
    width: 100%;
    max-width: 400px;
    margin-top: 2vh;
    margin-bottom: 15px;
  }
  .title-image-container img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
  }

  /* Instructions */
  .instructions-panel {
    background: rgba(0,0,0,0.6);
    border: 1px solid var(--primary);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #a9c2d8;
    width: 100%;
    box-sizing: border-box;
  }
  .instructions-title {
    color: var(--primary);
    font-weight: bold;
    text-align: center;
    margin-bottom: 10px;
    font-size: 1rem;
    letter-spacing: 1px;
  }
  .instructions-panel ul {
    padding-left: 20px;
    margin: 0;
  }
  .instructions-panel li {
    margin-bottom: 5px;
  }
  
  .btn-start, .btn-retry {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 15px 30px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    width: 100%;
    margin-bottom: 10px;
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2);
  }
  .btn-start:hover, .btn-retry:hover {
    background: var(--primary);
    color: var(--bg-dark);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
  }

  /* Game Screen */
  .status-bar {
    width: 100%;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .hp-label {
    font-size: 0.8rem;
    font-weight: bold;
    color: var(--hp-color);
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
  }
  .hp-bar-container {
    width: 100%;
    height: 12px;
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
  }
  .hp-bar {
    height: 100%;
    background: linear-gradient(90deg, #00bfff, var(--hp-color));
    width: 100%;
    transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.5s ease;
  }

  .question-panel {
    background: var(--panel-bg);
    border: 1px solid rgba(0, 229, 255, 0.3);
    border-radius: 8px;
    padding: 12px 15px;
    width: 100%;
    margin-bottom: 10px;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .q-number {
    font-size: 0.8rem;
    color: var(--primary);
    margin-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 3px;
    font-weight: bold;
  }
  .q-text {
    font-size: 0.9rem;
    line-height: 1.4;
  }

  /* --- Box Stacking Area --- */
  #stack-area {
    flex-grow: 1;
    width: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .platform {
    width: 140px;
    height: 8px;
    background: var(--primary);
    border-radius: 4px;
    box-shadow: 0 0 15px var(--primary);
    position: relative;
    z-index: 10;
  }
  .platform::before {
    content: "あなたのココロ";
    position: absolute;
    top: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 0.7rem;
    color: var(--primary);
    opacity: 0.7;
  }
  
  #box-container {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    width: 100%;
    position: absolute;
    bottom: 8px;
    z-index: 5;
  }

  .box {
    width: 80px;
    height: 35px;
    background: #d4a373;
    border: 2px solid #8b5a2b;
    border-radius: 3px;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3e2723;
    font-size: 0.75rem;
    font-weight: 900;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 20px);
    transition: transform 0.5s ease, opacity 0.5s ease;
  }

  /* Animations for boxes */
  @keyframes dropIn {
    0% { transform: translateY(-150px) scale(1.1); opacity: 0; }
    60% { transform: translateY(10px) scale(0.95); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .anim-drop {
    animation: dropIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
  }
  .anim-fly-away {
    transform: translateY(-50px) scale(0.5);
    opacity: 0;
  }

  /* --- Choices Area --- */
  #choices-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
    margin-bottom: 10px;
  }

  .btn-choice {
    font-size: 0.85rem;
    text-align: left;
    padding: 10px 12px;
    color: #e2e8f0;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    box-shadow: none;
    background: rgba(16, 28, 48, 0.6);
    line-height: 1.3;
    cursor: pointer;
  }
  .btn-choice:active {
    background: rgba(0, 229, 255, 0.3);
    border-color: var(--primary);
  }
  .btn-choice:disabled {
    opacity: 0.6;
    pointer-events: none;
  }

  /* Feedback Overlay */
  #feedback-overlay {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    border: 2px solid var(--primary);
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: pre-line;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
    width: 80%;
  }
  .feedback-damage { color: #ff4757; border-color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.5); }
  .feedback-heal { color: #2ed573; border-color: #2ed573; text-shadow: 0 0 10px rgba(46,213,115,0.5); }
  .feedback-guard { color: #feca57; border-color: #feca57; text-shadow: 0 0 10px rgba(254,202,87,0.5); }
  .feedback-boundary { color: var(--primary); text-shadow: 0 0 15px var(--primary); }
  .feedback-crash { color: #ff0000; border-color: #ff0000; font-size: 1.5rem; text-shadow: 0 0 20px #ff0000; background: rgba(50,0,0,0.9); }

  /* Explanation Modal */
  #explanation-modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 15, 22, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
    box-sizing: border-box;
  }
  .explanation-content {
    background: var(--panel-bg);
    border: 1px solid var(--hp-color);
    border-radius: 8px;
    padding: 25px 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
    text-align: left;
  }
  .exp-title {
    color: var(--hp-color);
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 15px;
    text-align: center;
    border-bottom: 1px solid rgba(0, 255, 204, 0.3);
    padding-bottom: 10px;
    letter-spacing: 2px;
  }
  .exp-text {
    font-size: 0.95rem;
    line-height: 1.7;
    margin-bottom: 25px;
    white-space: pre-line;
  }
  .btn-next-battle {
    background: var(--primary);
    color: var(--bg-dark);
    border: none;
    padding: 15px;
    width: 100%;
    border-radius: 4px;
    font-weight: bold;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
    transition: background 0.3s;
  }
  .btn-next-battle:active {
    background: #00bfff;
    box-shadow: 0 2px 5px rgba(0, 229, 255, 0.4);
  }

  /* Result Screen */
  .result-title {
    font-size: 1.2rem;
    color: #8fa3c0;
    margin-bottom: 10px;
    letter-spacing: 2px;
    margin-top: 5vh;
  }
  .result-class {
    font-size: 2rem;
    font-weight: 900;
    margin-bottom: 15px;
    color: #fff;
    text-shadow: 0 0 15px rgba(255,255,255,0.5);
    text-align: center;
  }
  .result-desc {
    background: var(--panel-bg);
    padding: 15px;
    border-radius: 8px;
    line-height: 1.6;
    margin-bottom: 20px;
    font-size: 0.9rem;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    width: 100%;
    box-sizing: border-box;
  }
  
  .footer {
    margin-top: auto;
    padding: 10px 0;
    font-size: 0.7rem;
    color: #555;
    text-align: center;
  }

  /* Screen Shake Effects */
  @keyframes shakeHard {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-3px, -4px) rotate(-1deg); }
    20% { transform: translate(-6px, 0px) rotate(1deg); }
    30% { transform: translate(6px, 4px) rotate(0deg); }
    40% { transform: translate(2px, -2px) rotate(1deg); }
    50% { transform: translate(-2px, 4px) rotate(-1deg); }
    60% { transform: translate(-6px, 2px) rotate(0deg); }
    70% { transform: translate(6px, 2px) rotate(-1deg); }
    80% { transform: translate(-2px, -2px) rotate(1deg); }
    90% { transform: translate(2px, 4px) rotate(0deg); }
    100% { transform: translate(1px, -4px) rotate(-1deg); }
  }
  .shake-hard {
    animation: shakeHard 0.5s ease-in-out;
  }
  @keyframes damageFlash {
    0% { background-color: rgba(255, 0, 0, 0.4); }
    100% { background-color: var(--bg-dark); }
  }
  .flash-damage {
    animation: damageFlash 0.3s ease-out;
  }
</style>
</head>
<body>

<div id="app-container">
  
  <!-- タイトル画面 -->
  <div id="screen-title" class="screen active">
    <div class="title-image-container">
      <img src="https://raw.githubusercontent.com/t3takahashit3-cell/20261109asahi/main/top.jpg" alt="FINAL BOUNDARY">
    </div>
    
    <div class="instructions-panel">
      <div class="instructions-title">【 GAME SYSTEM 】</div>
      <ul>
        <li>全10問の状況に対し、直感で行動を選んでください。</li>
        <li>行動によって、心の「体力(HP)」と「荷物」が変動します。</li>
        <li>荷物を抱え込みすぎると<b>クラッシュ（崩壊）</b>します。</li>
        <li>サウンドをONにしてお楽しみください。</li>
      </ul>
    </div>

    <!-- ※注意※ 以下の GAS_WEB_APP_URL を、Step 1で取得したURLに書き換えてください -->
    <button class="btn-start" onclick="startGame()">MISSION START</button>
    <div class="footer">&copy; 2026 KOKUZO</div>
  </div>

  <!-- ゲーム画面 -->
  <div id="screen-game" class="screen">
    <div class="status-bar">
      <div class="hp-label">
        <span>ココロの体力 (HP)</span>
        <span id="hp-value">100 / 100</span>
      </div>
      <div class="hp-bar-container">
        <div id="hp-bar" class="hp-bar"></div>
      </div>
    </div>
    
    <div class="question-panel">
      <div id="q-number" class="q-number">BATTLE 01 / 10</div>
      <div id="q-text" class="q-text"></div>
    </div>
    
    <!-- 物理演算風の荷物積み上げエリア -->
    <div id="stack-area">
      <div id="box-container"></div>
      <div class="platform"></div>
    </div>
    
    <div id="choices-container"></div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <div class="result-title">DIAGNOSIS RESULT</div>
    <div style="font-size: 0.9rem; margin-bottom:5px; color:#e2e8f0;">現在のあなたのジョブクラスは...</div>
    <div id="result-class" class="result-class"></div>
    <div id="result-desc" class="result-desc"></div>
    <button class="btn-retry" onclick="resetGame()">タイトルへ戻る</button>
    <div class="footer">&copy; 2026 KOKUZO</div>
  </div>

  <!-- フィードバック（ダメージ等）オーバーレイ -->
  <div id="feedback-overlay"></div>
  
  <!-- 解説モーダル -->
  <div id="explanation-modal">
    <div class="explanation-content">
      <div class="exp-title">状況の振り返り</div>
      <div id="exp-text" class="exp-text"></div>
      <button class="btn-next-battle" onclick="closeExplanation()">次のBATTLEへ</button>
    </div>
  </div>

</div>

<script>
  // ----------------------------------------------------
  // ▼ ここにGASのウェブアプリURLを貼り付けてください ▼
  // ----------------------------------------------------
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdnIp4465GTlEuv682wQeRGB5XBIUuCsKsHBl0NsqaUzRaM1qiscDAH9fSIIonutq9/exec"; 
  
  // オーディオの設定（GitHubのRaw URLを使用）
  const bgmMain = new Audio("https://raw.githubusercontent.com/t3takahashit3-cell/20261109asahi/main/Endurance_Game.mp3");
  bgmMain.loop = true;
  bgmMain.volume = 0.5;

  const bgmEnding = new Audio("https://raw.githubusercontent.com/t3takahashit3-cell/20261023chikuma/main/ed.mp3");
  bgmEnding.loop = true;
  bgmEnding.volume = 0.5;

  const questions = [
    {
      q: "【BATTLE 01】
一生懸命関わっているのに、子どもから拒絶された。「先生なんか嫌い！」と言われ、気持ちが沈んでいる。",
      choices: [
        { text: "自分の指導力不足だ。もっと頑張って関わらなければ。", type: "A" },
        { text: "拒絶されて傷つくのは自然なことだと、自分の気持ちを認める。", type: "B" },
        { text: "傷つきたくないので、しばらく必要最低限の関わりにする。", type: "C" },
        { text: "同僚や上司に状況を報告し、チームとしての対応方針を相談する。", type: "D" }
      ],
      explanation: "子どもから拒絶されると、自分が否定されたように感じて深く傷つくのは当然のことです。
しかし、これは子どもが自分の欲求を通すための無意識の行動（試し行動など）であることが多く、あなた自身の価値が否定されたわけではありません。

「相手の課題」として境界線を引き、同僚と情報を共有しましょう。あなたは十分頑張っています。一人で抱え込まず、チームの力を頼ってくださいね！"
    },
    {
      q: "【BATTLE 02】
何度注意してもルールを守れず、同じトラブルを繰り返す子どもがいる。「自分の関わり方が悪いのだろうか」と思い悩む。",
      choices: [
        { text: "自分の努力不足と考え、さらに一人で対応に時間を割く。", type: "A" },
        { text: "子どもの小さな変化を探し、日々の関わりを肯定的に振り返る。", type: "B" },
        { text: "何度言っても無駄だと考え、注意するのをやめる。", type: "C" },
        { text: "一人の努力で変えられる限界だと認識し、ケース会議にかける。", type: "D" }
      ],
      explanation: "繰り返される問題に直面すると、真面目な人ほど原因を自分の能力に求めやすくなります。
しかし、子どもの行動にはさまざまな背景があり、一人の職員の努力だけで変えられるとは限りません。

個人の反省を続けるのではなく、チームで状況を捉え直すことが大切です。子どもの問題行動はあなたのせいではありません。チーム全体で支え合う視点を持ちましょう。応援しています！"
    },
    {
      q: "【BATTLE 03】
子どものために毎日頑張っているが、目立った成果や変化が見えず、徒労感を覚えている。",
      choices: [
        { text: "成果が見えるまで、歯を食いしばってもっと頑張る。", type: "A" },
        { text: "「今日できたこと」に目を向け、自分の価値を確認する。", type: "B" },
        { text: "子どもが変わらない以上、自分の仕事には意味がないと諦める。", type: "C" },
        { text: "今の状況を同僚に話し、見えていない変化がないか客観的意見を聞く。", type: "D" }
      ],
      explanation: "仕事の成果を「子どもの大きな変化」だけで測ってしまうと、日々の支援の価値が見えにくくなります。
安心して話せる時間を作った、感情的にならずに話を聞けたなど、日々のあなたの関わりそのものに大きな意味があります。

目に見えない小さな変化に気づけるあなたの関わりは、間違いなく子どもの支えになっています。自分の頑張りを認めてあげてくださいね。"
    },
    {
      q: "【BATTLE 04】
今日は休日。しかし「あの時もっと違う声かけをすれば…」と、子どものことが頭から離れない。",
      choices: [
        { text: "責任感がある証拠だ。休日も支援について考え続けるべきだ。", type: "A" },
        { text: "「休日も考えるほど真剣に向き合っている」と自分を労う。", type: "B" },
        { text: "仕事のことは一切考えないよう、無理やり記憶から消し去る。", type: "C" },
        { text: "休むことも専門性だと割り切り、意識的にスイッチをオフにする。", type: "D" }
      ],
      explanation: "「子どもを大切にすること」と「自分の時間を大切にすること」は両立できます。
勤務時間外にも考え続けてしまう時は、「今自分が対応すべきことか」「他の職員に共有することか」を整理しましょう。

休むことも、長く支援を続けるための立派な「仕事」です。どうか罪悪感を持たず、自分自身を大切に休ませてあげてください。"
    },
    {
      q: "【BATTLE 05】
職員間でルールの厳しさに温度差がある。自分だけが注意する「口うるさい悪者」になっているようで孤独だ。",
      choices: [
        { text: "自分が厳しすぎるのかもと考え、無理に他の職員に合わせてルールを緩める。", type: "A" },
        { text: "悪者になるのは辛いが、子どもの安全を思えばこその行動だと自分を肯定する。", type: "B" },
        { text: "どうせ誰も合わせてくれないので、ルール違反を見ても無視する。", type: "C" },
        { text: "子どもが混乱しないよう、職員会議で「施設としての基準」のすり合わせを行う。", type: "D" }
      ],
      explanation: "孤立感を感じると「自分が厳しすぎるのか」と不安になりがちです。
しかし、職員間の温度差は個人の性格の問題ではなく、「チームの基準が曖昧である」という組織の構造的な課題です。個人的な不満としてではなく、「一貫した支援のため」にチームで基準を再構築しましょう。

組織のルールの曖昧さを一人で背負う必要はありません。子どものためを思って行動できるあなたの姿勢は素晴らしいです！"
    },
    {
      q: "【BATTLE 06】
ヘトヘトに疲れて相談したいが、上司や周囲の職員も常に忙しそうに走り回っている。",
      choices: [
        { text: "みんな大変なのだから、自分だけこの程度で弱音を吐いてはいけないと我慢する。", type: "A" },
        { text: "「限界が来ている」と自分の状態を認め、帰宅後にゆっくり休む。", type: "B" },
        { text: "誰にもわかってもらえないと心を閉ざし、周囲との会話を避ける。", type: "C" },
        { text: "「5分だけ相談に乗ってほしい」と声をかけ、業務の調整を求める。", type: "D" }
      ],
      explanation: "責任感が強い人ほど「みんな大変だから」とSOSを飲み込んでしまいがちですが、個人の我慢で乗り切ろうとすることは燃え尽きを招きます。
自分の限界を適切に発信し、チームにサポートを求めることも重要な仕事のスキルです。

SOSを出すのは勇気がいりますが、あなたが倒れてしまっては元も子もありません。限界を伝えることは、立派なプロのスキルですよ！"
    },
    {
      q: "【BATTLE 07】
子どもから「〇〇先生は許してくれたのに！」と比較され、否定された気持ちになった。",
      choices: [
        { text: "好かれていないと落ち込み、同僚のように甘く接しようと無理をする。", type: "A" },
        { text: "子どもは大人を比べるものだと客観的に捉え、感情的に受け取らない。", type: "B" },
        { text: "腹が立つので、「じゃあ〇〇先生のところに行きなさい」と突き放す。", type: "C" },
        { text: "「私はダメだと思う」と毅然と伝え、後で同僚とその出来事を共有し連携する。", type: "D" }
      ],
      explanation: "子どもから他の職員と比べられると傷つきますよね。でも、これは子どもが大人を操作しようとする無意識の行動であることが多いのです。
同僚を敵視するのではなく、「子どもが混乱するのを防ぐための連携チャンス」と捉え直してみましょう。

比較されて傷つくのは、あなたが真剣に向き合っている証拠です。あなたの価値が減るわけではないので、どうか自信を持ってくださいね。"
    },
    {
      q: "【BATTLE 08】
突発的なトラブルに現場で必死に対応したのに、後から上司に結果論で「なぜこうしなかった」と指摘された。",
      choices: [
        { text: "自分の判断がすべて間違っていたと深く反省し、ひどく落ち込む。", type: "A" },
        { text: "「あの状況下では最善を尽くした」と、まずは現場での自分の頑張りを労う。", type: "B" },
        { text: "安全な場所からの文句だと反発し、上司の言葉を右から左へ聞き流す。", type: "C" },
        { text: "現場の切迫した状況を伝え、今後のトラブル時の手順化を提案する。", type: "D" }
      ],
      explanation: "必死の対応の後に否定的なフィードバックを受けると、強い徒労感や怒りを感じるものです。
まずは「その場にいた自分にしかわからない最善を尽くした」と自分を労いましょう。上司の言葉は個人攻撃ではなく「組織としての振り返り」と変換し、今後の手順化に繋げれば大丈夫です。

緊迫した現場でのあなたの判断と頑張りは本物です。結果論に振り回されず、まずは「あの時よくやった」と自分を褒めてあげましょう！"
    },
    {
      q: "【BATTLE 09】
保護者からの理不尽な強い要求に対し、組織として守ってもらえず、自分一人だけが矢面に立たされている。",
      choices: [
        { text: "自分の説明不足だと身を粉にして要求に応えようとし、限界を迎える。", type: "A" },
        { text: "「個人的な問題ではなく施設への要求だ」と境界線を意識し、自責を防ぐ。", type: "B" },
        { text: "対応が怖くなり、クレーム保護者からの連絡をすべて居留守で避ける。", type: "C" },
        { text: "一人で対応する限界を上司に伝え、複数名での面談や統一回答を強く求める。", type: "D" }
      ],
      explanation: "真面目な職員ほど「自分の力で解決しなければ」と抱え込み、心身を壊してしまいます。
保護者からの過剰な要求は、一職員の責任範囲（自分の荷物）を完全に超えています。「組織の課題」としてボールを渡し、チーム対応へと引き上げることが絶対に必要です。

理不尽な要求は、一人の職員が背負う「荷物」ではありません。あなたは悪くありません。堂々と組織にバトンを渡して自分を守ってくださいね！"
    },
    {
      q: "【BATTLE 10】
同僚の対応と比較して、「自分は上手くできない。向いていないのではないか」と感じてしまう。",
      choices: [
        { text: "同僚に追いつくため、寝る間も惜しんでもっと努力しなければと焦る。", type: "A" },
        { text: "同僚の強みと自分の強みは違うと考え、自分の長所を見つめ直す。", type: "B" },
        { text: "比較すると落ち込むので、同僚の対応を見ないように距離を置く。", type: "C" },
        { text: "自分の苦手な部分を認め、同僚の対応から学べる部分を取り入れる。", type: "D" }
      ],
      explanation: "他者との比較は、自分の不足を見つけるためだけに使う必要はありません。
「自分にはできない」と落ち込むのではなく、「自分が取り入れられることは何か」と考えればいいのです。自分の得意・不得意を理解し、他者の力を借りながら働くことも大切な専門性です。

他の人と違うあなたの持ち味（長所）が、必ず別の子どもの救いになっています。完璧でなくて大丈夫。自分らしさを大切にしてください！"
    }
  ];

  const boxWords = ["私のせい", "我慢", "責任感", "完璧に", "イライラ", "期待", "理不尽", "クレーム", "ため息", "孤独"];
  let boxes = [];
  const CRASH_THRESHOLD = 7; 

  let currentQ = 0;
  let hp = 100;
  let scores = { A: 0, B: 0, C: 0, D: 0 };
  let isAnimating = false;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function startGame() {
    bgmEnding.pause();
    bgmEnding.currentTime = 0;
    bgmMain.play().catch(e => console.log("Audio play blocked by browser:", e));

    currentQ = 0;
    hp = 100;
    scores = { A: 0, B: 0, C: 0, D: 0 };
    boxes = [];
    document.getElementById('box-container').innerHTML = '';
    document.body.className = '';
    document.body.style.backgroundImage = "radial-gradient(circle at center, #1a2a40 0%, #0a0f16 100%)";
    updateHPBar();
    loadQuestion();
    showScreen('screen-game');
  }

  function loadQuestion() {
    if (currentQ >= questions.length) {
      showResult();
      return;
    }
    const q = questions[currentQ];
    document.getElementById('q-number').innerText = `BATTLE ${String(currentQ + 1).padStart(2, '0')} / 10`;
    document.getElementById('q-text').innerText = q.q;
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    
    let shuffledChoices = [...q.choices].sort(() => Math.random() - 0.5);
    
    shuffledChoices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'btn-choice';
      btn.innerText = choice.text;
      btn.onclick = () => selectAnswer(choice.type);
      container.appendChild(btn);
    });
  }

  function addBoxes(count) {
    const container = document.getElementById('box-container');
    let delay = 0;
    for(let i=0; i<count; i++) {
      setTimeout(() => {
        const box = document.createElement('div');
        box.className = 'box anim-drop';
        const rotation = (Math.random() - 0.5) * 6;
        box.style.transform = `rotate(${rotation}deg)`;
        box.innerText = boxWords[Math.floor(Math.random() * boxWords.length)];
        container.appendChild(box);
        boxes.push(box);
      }, delay);
      delay += 150;
    }
    return delay; 
  }

  function removeBoxes(count) {
    let delay = 0;
    for(let i=0; i<count; i++) {
      if(boxes.length > 0) {
        setTimeout(() => {
          const box = boxes.pop();
          box.classList.remove('anim-drop');
          box.classList.add('anim-fly-away');
          setTimeout(() => box.remove(), 500);
        }, delay);
        delay += 150;
      }
    }
    return delay;
  }

  function triggerCrash() {
    const container = document.getElementById('box-container');
    document.body.classList.add('shake-hard');
    
    boxes.forEach(box => {
      box.classList.remove('anim-drop');
      const tx = (Math.random() - 0.5) * 300;
      const ty = -(Math.random() * 200 + 100);
      const rot = (Math.random() - 0.5) * 720;
      box.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg)`;
      box.style.opacity = '0';
    });
    
    setTimeout(() => {
      document.body.classList.remove('shake-hard');
      container.innerHTML = '';
      boxes = [];
    }, 800);
  }

  // フィードバック表示用関数（コールバック対応）
  function showFeedbackOverlay(text, className, callback) {
    const overlay = document.getElementById('feedback-overlay');
    overlay.innerText = text;
    overlay.className = className;
    overlay.style.opacity = '1';
    
    setTimeout(() => {
      overlay.style.opacity = '0';
      setTimeout(() => {
        if(callback) callback();
      }, 300);
    }, 1500);
  }

  // 解説モーダル表示
  function showExplanation() {
    const modal = document.getElementById('explanation-modal');
    document.getElementById('exp-text').innerText = questions[currentQ].explanation;
    modal.style.display = 'flex';
  }

  // 解説モーダルを閉じて次へ
  function closeExplanation() {
    document.getElementById('explanation-modal').style.display = 'none';
    proceedNext();
  }

  function selectAnswer(type) {
    if(isAnimating) return;
    isAnimating = true;
    scores[type]++;
    
    document.querySelectorAll('.btn-choice').forEach(b => b.disabled = true);
    
    let animDelay = 0;

    if (type === 'A') {
      animDelay = addBoxes(3);
    } else if (type === 'B') {
      animDelay = addBoxes(1);
    } else if (type === 'D') {
      animDelay = removeBoxes(2);
    }

    setTimeout(() => {
      if (boxes.length > CRASH_THRESHOLD) {
        triggerCrash();
        hp -= 40; 
        
        setTimeout(() => {
          updateHPBar();
          showFeedbackOverlay("キャパオーバー！\n荷物が崩壊した...\nHP -40", "feedback-crash", showExplanation);
        }, 800);
      } else {
        let overlayText = "";
        let overlayClass = "";
        
        if (type === 'A') {
          hp -= 15;
          document.body.classList.add('flash-damage');
          setTimeout(() => document.body.classList.remove('flash-damage'), 300);
          overlayText = "過剰適応！\n荷物を抱え込んだ\nHP -15";
          overlayClass = "feedback-damage";
        } else if (type === 'B') {
          hp += 5;
          overlayText = "自己受容！\n自分を認めた\nHP +5";
          overlayClass = "feedback-heal";
        } else if (type === 'C') {
          overlayText = "一時回避！\n荷物は増えないが孤立...\nHP増減なし";
          overlayClass = "feedback-guard";
        } else if (type === 'D') {
          hp += 15;
          overlayText = "ナイス・バウンダリー！\nチームにパスを出した！\nHP +15";
          overlayClass = "feedback-boundary";
        }
        
        updateHPBar();
        showFeedbackOverlay(overlayText, overlayClass, showExplanation);
      }
    }, animDelay + 200);
  }

  function proceedNext() {
    currentQ++;
    loadQuestion();
    isAnimating = false;
  }

  function updateHPBar() {
    if (hp > 100) hp = 100;
    if (hp < 0) hp = 0;
    
    const bar = document.getElementById('hp-bar');
    const val = document.getElementById('hp-value');
    bar.style.width = hp + '%';
    val.innerText = `${hp} / 100`;
    
    if(hp <= 30) {
      bar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b81)';
      val.style.color = '#ff4757';
    } else if (hp <= 60) {
      bar.style.background = 'linear-gradient(90deg, #feca57, #ff9f43)';
      val.style.color = '#feca57';
    } else {
      bar.style.background = 'linear-gradient(90deg, #00bfff, var(--hp-color))';
      val.style.color = 'var(--hp-color)';
    }
  }

  // GASへ結果を送信する処理
  function sendResultToGAS(finalType) {
    if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== "https://script.google.com/macros/s/AKfycbzdnIp4465GTlEuv682wQeRGB5XBIUuCsKsHBl0NsqaUzRaM1qiscDAH9fSIIonutq9/exec") {
      const formData = new FormData();
      formData.append("type", finalType);
      
      fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      }).then(() => {
        console.log("GASへ送信完了:", finalType);
      }).catch(err => {
        console.error("GAS送信エラー:", err);
      });
    }
  }

  function showResult() {
    // BGMの切り替え
    bgmMain.pause();
    bgmEnding.play().catch(e => console.log(e));

    showScreen('screen-result');
    
    let maxType = 'A';
    let maxScore = scores.A;
    if(scores.B > maxScore) { maxType = 'B'; maxScore = scores.B; }
    if(scores.C > maxScore) { maxType = 'C'; maxScore = scores.C; }
    if(scores.D > maxScore) { maxType = 'D'; maxScore = scores.D; }

    if(scores.D >= maxScore && scores.D >= 3) { maxType = 'D'; } 

    // GASへ送信
    sendResultToGAS(maxType);

    const className = document.getElementById('result-class');
    const classDesc = document.getElementById('result-desc');

    if (maxType === 'A') {
      className.innerText = "満身創痍の『勇者』";
      className.style.color = "#ff4757";
      document.body.style.backgroundImage = "radial-gradient(circle at center, #300000 0%, #0a0f16 100%)";
      classDesc.innerHTML = "責任感が人一倍強く、すべての荷物を一人で背負ってHPが削られがちです。<br><br>限界が来る前に「それは本当に自分の荷物か？」と立ち止まる勇気を持ちましょう。";
    } else if (maxType === 'B') {
      className.innerText = "悟りを開く『修行僧』";
      className.style.color = "#2ed573";
      document.body.style.backgroundImage = "radial-gradient(circle at center, #002b11 0%, #0a0f16 100%)";
      classDesc.innerHTML = "自分の感情をコントロールし、物事の良い面を見るセルフケアの術を持っています。<br><br>ただ、自分の中だけで解決しすぎているかも。時には周りにボールを投げても大丈夫です。";
    } else if (maxType === 'C') {
      className.innerText = "堅牢なる『城壁』";
      className.style.color = "#feca57";
      document.body.style.backgroundImage = "radial-gradient(circle at center, #332700 0%, #0a0f16 100%)";
      classDesc.innerHTML = "これ以上傷つかないよう、心のシャッターを下ろして自分を守る防衛本能が働いています。<br><br>限界が来る前に、安全だと思える同僚に少しだけ弱音を吐き、チームの力を借りてみませんか。";
    } else if (maxType === 'D') {
      className.innerText = "連携の達人『指揮者』";
      className.style.color = "#00e5ff";
      document.body.style.backgroundImage = "radial-gradient(circle at center, #002233 0%, #0a0f16 100%)";
      classDesc.innerHTML = "素晴らしい！自分と相手の境界線（バウンダリー）をしっかり引き、チームで対応できています。<br><br>今のペースを保ち、ぜひ職場で孤軍奮闘している周囲の職員に声をかけてあげてください。";
    }
  }

  function resetGame() {
    bgmEnding.pause();
    bgmEnding.currentTime = 0;
    showScreen('screen-title');
    document.body.style.backgroundImage = "radial-gradient(circle at center, #1a2a40 0%, #0a0f16 100%)";
  }
</script>
</body>
</html>
