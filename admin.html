<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL BOUNDARY - 管理者用ライブ集計</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background-color: #0a0f16;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    color: #00e5ff;
    text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    text-align: center;
    margin-bottom: 10px;
  }
  .loading {
    margin-bottom: 20px;
    color: #feca57;
    font-size: 0.9rem;
    text-align: center;
  }
  
  /* レイアウト：上部にメイン、下部にグリッド */
  .dashboard-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* メインの円グラフ */
  .main-chart-container {
    width: 100%;
    max-width: 500px;
    background: rgba(16, 28, 48, 0.85);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(0, 229, 255, 0.3);
  }
  .chart-title {
    text-align: center;
    color: #e2e8f0;
    font-size: 1.1rem;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 5px;
  }

  /* 個別設問の棒グラフグリッド (2行5列) */
  .q-charts-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    width: 100%;
  }
  .sub-chart-container {
    background: rgba(16, 28, 48, 0.85);
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .sub-title {
    text-align: center;
    font-size: 0.8rem;
    color: #00e5ff;
    margin-bottom: 5px;
  }
</style>
</head>
<body>

  <h1>会場ライブ集計</h1>
  <div id="loading" class="loading">データを取得中...（5秒ごとに更新）</div>
  
  <div class="dashboard-container">
    
    <!-- 総合結果の円グラフ -->
    <div class="main-chart-container">
      <div class="chart-title">【総合】職員の抱え込みタイプ</div>
      <canvas id="mainChart"></canvas>
    </div>

    <!-- 全10問の個別棒グラフ -->
    <div class="q-charts-grid">
      <!-- 1〜5問目 -->
      <div class="sub-chart-container"><div class="sub-title">BATTLE 01</div><canvas id="qChart0"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 02</div><canvas id="qChart1"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 03</div><canvas id="qChart2"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 04</div><canvas id="qChart3"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 05</div><canvas id="qChart4"></canvas></div>
      <!-- 6〜10問目 -->
      <div class="sub-chart-container"><div class="sub-title">BATTLE 06</div><canvas id="qChart5"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 07</div><canvas id="qChart6"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 08</div><canvas id="qChart7"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 09</div><canvas id="qChart8"></canvas></div>
      <div class="sub-chart-container"><div class="sub-title">BATTLE 10</div><canvas id="qChart9"></canvas></div>
    </div>
    
  </div>

<script>
  // ▼ ここにご自身のGASのURLを貼り付けてください ▼
  const GAS_WEB_APP_URL = "YOUR_GAS_WEBAPP_URL_HERE"; 
  
  let mainChart = null;
  let qCharts = []; // 10個のサブチャートを格納する配列

  function fetchDataAndUpdateChart() {
    fetch(GAS_WEB_APP_URL)
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          document.getElementById('loading').innerText = "GASエラー: " + data.error;
          return;
        }
        document.getElementById('loading').innerText = `最新データ取得完了：${new Date().toLocaleTimeString()}`;
        
        // メインチャート（円グラフ）の更新
        const finalData = [ data.final.A || 0, data.final.B || 0, data.final.C || 0, data.final.D || 0 ];
        updateMainChart(finalData);

        // 各質問（棒グラフ）の更新
        if (data.q && data.q.length === 10) {
          for (let i = 0; i < 10; i++) {
            const qData = [ data.q[i].A || 0, data.q[i].B || 0, data.q[i].C || 0, data.q[i].D || 0 ];
            updateSubChart(i, qData);
          }
        }
      })
      .catch(error => {
        document.getElementById('loading').innerText = "通信エラー: " + error.message;
      });
  }

  function updateMainChart(data) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    if (mainChart) {
      mainChart.data.datasets[0].data = data;
      mainChart.update();
    } else {
      mainChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['A(自責・抱え込み)', 'B(自己完結)', 'C(回避・壁)', 'D(チーム連携)'],
          datasets: [{
            data: data,
            backgroundColor: ['#ff4757', '#2ed573', '#feca57', '#00e5ff'],
            borderColor: '#0a0f16', borderWidth: 2
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#e2e8f0', font: { size: 12 } } } } }
      });
    }
  }

  function updateSubChart(index, data) {
    const ctx = document.getElementById('qChart' + index).getContext('2d');
    if (qCharts[index]) {
      qCharts[index].data.datasets[0].data = data;
      qCharts[index].update();
    } else {
      qCharts[index] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['A', 'B', 'C', 'D'],
          datasets: [{
            data: data,
            backgroundColor: ['#ff4757', '#2ed573', '#feca57', '#00e5ff']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }, // 凡例非表示（狭いので）
          scales: {
            x: { ticks: { color: '#e2e8f0' } },
            y: { ticks: { color: '#e2e8f0', stepSize: 1 }, beginAtZero: true }
          }
        }
      });
    }
  }

  // 初回実行と定期更新
  fetchDataAndUpdateChart();
  setInterval(fetchDataAndUpdateChart, 5000);
</script>
</body>
</html>
